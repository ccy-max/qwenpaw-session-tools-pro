name: Release on Tag

# 打 tag（v*）时自动构建插件安装包并挂到 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build plugin package (zip)
        run: python scripts/build_release.py "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SessionToolsPro ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/session-tools-pro-*.zip
          draft: false
          prerelease: false
